[build]
  # Netlify's build image has no Flutter SDK by default — install it fresh
  # each build (shallow clone, stable channel) rather than assuming one is
  # present, then build the actual web app.
  command = "flutter/bin/flutter build web"
  publish = "build/web"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
