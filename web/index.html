<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Placeholder only: Flutter's engine removes this tag at startup and
       inserts its own, which the script at the end of <body> then pins to
       maximum-scale=1 (see the comment there). Anything added here, e.g.
       viewport-fit=cover, never reaches the running app — which is why
       app_shell.dart has to floor the tab bar's bottom inset by hand. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="description" content="ZebraPace — a gentle, pacing-focused health tracker for EDS, PEM, and Dysautonomia.">
  <meta name="theme-color" content="#F6EFE3">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Legacy key, but still required by iOS Safari for true standalone
       (no address bar) launch when added to the home screen. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ZebraPace">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ZebraPace</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    Flutter Web's engine deletes any <meta name="viewport"> above at startup
    and inserts its own with maximum-scale=5.0. On iOS Safari that lets the
    browser auto-zoom whenever a text field (steps, weight, …) gets focus,
    and since Flutter disables native touch handling (touch-action: none)
    the user can't pinch back out. Re-pin maximum-scale=1 on whatever
    viewport tag ends up in <head>: iOS honours it for focus auto-zoom but
    still ignores it for deliberate pinch-zoom (accessibility), so this
    doesn't take zoom away from anyone who needs it.
  -->
  <script>
    (function () {
      var WANT = 'width=device-width, initial-scale=1.0, maximum-scale=1.0';
      function pin() {
        var metas = document.head.querySelectorAll('meta[name="viewport"]');
        for (var i = 0; i < metas.length; i++) {
          if (metas[i].getAttribute('content') !== WANT) {
            metas[i].setAttribute('content', WANT);
          }
        }
      }
      pin();
      new MutationObserver(pin).observe(document.head, {
        childList: true, subtree: true, attributes: true, attributeFilter: ['content']
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
